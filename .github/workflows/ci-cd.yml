name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint backend
        working-directory: backend
        run: |
          npm ci
          npm run lint

      - name: Lint frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Build backend
        working-directory: backend
        run: |
          npm ci
          npm run build

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: backend
          path: |
            backend/dist
            backend/prisma
            backend/package.json
            backend/package-lock.json
            backend/Dockerfile

      - uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: frontend/dist

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: drinkexchange
          POSTGRES_PASSWORD: drinkexchange
          POSTGRES_DB: drinkexchange_test
        ports:
          - 5434:5432
        options: --health-cmd "pg_isready -U drinkexchange"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test backend
        working-directory: backend
        run: |
          npm ci
          npm test -- --coverage

      - name: Test frontend
        working-directory: frontend
        run: |
          npm ci
          npm test -- --coverage

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            backend/coverage
            frontend/coverage

  deploy:
    needs: [lint, build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: backend
          path: backend

      - uses: actions/download-artifact@v4
        with:
          name: frontend
          path: frontend

      - name: Deploy backend (Railway)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: npx @railway/cli up backend --path-as-root --service backend --ci

      - name: Deploy frontend (Vercel)
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          cat > frontend/vercel.json <<EOF
          {
            "rewrites": [
              { "source": "/api/(.*)", "destination": "${{ vars.BACKEND_URL }}/api/\$1" },
              { "source": "/(.*)", "destination": "/index.html" }
            ]
          }
          EOF
          npx vercel deploy frontend --prod --yes --token ${{ secrets.VERCEL_TOKEN }}
